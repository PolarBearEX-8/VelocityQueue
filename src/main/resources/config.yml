queue-server: "login"
main-server: "main"
main-server-slots: 200
# Limit queue transfers to main when slots are available. Apply changes with /queue reload.
AntiFlood:
  # Rolling interval in seconds; decimals are supported. Minimum: 1. Checked every 0.5 seconds.
  interval-seconds: 3.5
  # Maximum transfer attempts per interval, shared by both queues. Minimum: 1.
  # Example: 3.5 seconds / 1 player allows one attempt in any 3.5-second window.
  # The first batch can start immediately. Failed attempts count; unused quota does not accumulate.
  players-per-interval: 1

# Applies to players with queue.priority after successful AuthMe login.
priority:
  # queue: Priority players go before regular players, FIFO within each group, using AntiFlood.
  # bypass: Skip queue order and AntiFlood. Automatic transfers are checked every 0.5 seconds.
  mode: queue
  # Only for bypass mode. true: Ignore this plugin's main-server-slots limit.
  # false: Wait for a free slot. The backend must still accept the connection.
  # Does not bypass AuthMe or change the existing queue.bypass permission.
  bypass-player-limit: false
authme:
  # ต้องติดตั้ง QueueLoginBridge บน queue-server เพื่อแยก prompt Login กับ Register
  # เมื่อใช้ Bridge ให้ตั้ง AuthMe Hooks.velocity: false ดูวิธีติดตั้งใน README ของ Bridge
  # แสดงระหว่างรอ Bridge ตรวจว่าบัญชีนี้เคย Register แล้วหรือยัง
  checking-title: "&eChecking account"
  checking-subtitle: "&7Please wait"
  # แสดงเมื่อมีบัญชีแล้ว แต่ยังไม่ได้ Login
  login-title: "&ePlease login"
  login-subtitle: "&7/login <password>"
  # แสดงเมื่อยังไม่มีบัญชีและต้อง Register ก่อน
  register-title: "&ePlease register"
  register-subtitle: "&7/register <create your password> <re-type your password>"
  # หน่วงหลัง Bridge ส่งผลตรวจบัญชี ก่อนแสดง Login หรือ Register (หน่วย ms)
  # ระหว่างหน่วงนี้ Checking prompt ยังแสดงอยู่
  account-check-delay-ms: 500
  # ระยะเวลา Fade in ของ Checking, Login และ Register prompt (หน่วย ms)
  prompt-fade-in-ms: 500
  # เวลาที่ prompt แสดงหลัง Fade in เสร็จ (หน่วย ms; ต่ำสุด 1000, สูงสุด 86400000)
  prompt-stay-ms: 3600000
  # ระยะเวลา Fade out เมื่อ AuthMe ยืนยันว่า Login สำเร็จ (หน่วย ms)
  login-fade-out-ms: 600
messages:
  interval: 10
  server-full: "&62b2t-th is full"
  server-not-full: "&62b2t-th is not full"
  server-restarting: "&62b2t-th is restarting"
  queue-position: "&6Position in queue: &l%d"
  title-position: "&6Position in queue: &l%d"
  action-bar-priority-wait: "&6Priority Queue Estimated Wait: &l%priority_wait%"
  action-bar-skipped-last-hour: "&6Player who have skipped the queue in the last hour: &l%skipped_last_hour%"
  action-bar-non-priority-wait: "&6Non-Priority Queue Estimated Wait: &l%non_priority_wait%"
  queue-status: "&6Position in queue: &l%d"
  queue-joined: "&aYou joined the queue. Position: &l%d"
  queue-left: "&aYou left the queue."
  queue-already-in: "&cYou are already in the queue."
  queue-not-in: "&cYou are not in the queue."
  queue-end: "&6Connecting to the server."
#this shows the queue size when you hover over the ping on the server list
